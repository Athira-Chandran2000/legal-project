name: Legal RAG Multi-Tenant CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: "Install dependencies"
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: "Stage 1: Unit Tests"
      run: |
        pytest tests/

    - name: "Stage 2 & 3: Multi-Tenant & Isolation Smoke Tests"
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      run: |
        python scripts/evaluate.py --smoke-test

    - name: "Stage 5: Deploy to Hugging Face Spaces"
      if: github.ref == 'refs/heads/main' && success()
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git remote add hf https://Athira4224:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Athira4224/legal-rag-demo
        git push hf main --force
